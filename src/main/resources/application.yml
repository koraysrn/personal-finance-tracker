spring:
  application:
    name: finance
  datasource:
    url: jdbc:postgresql://localhost:5432/finans
    username: finans
    password: finans
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

app:
  scheduling:
    enabled: true
  transaction:
    allow-future-dates: false
  backup:
    dir: ./backups
  security:
    max-failed-login-attempts: 5
    lock-duration-minutes: 15
  currency:
    base: USD
