spring:
  datasource:
    url: jdbc:h2:mem:finance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:  Account
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

app:
  scheduling:
    enabled: false
  transaction:
    allow-future-dates: false
  security:
    max-failed-login-attempts: 5
    lock-duration-minutes: 15
  currency:
    base: USD
